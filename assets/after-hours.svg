<path d="M890 49h270v8H890z" fill="#73516e"/>
<path d="M905 46V15h26v31m7 0V23h19v23m8 0V11h28v35m8 0V19h20v27m8 0V8h25v38m8 0V22h21v24" fill="#30253f" stroke="#8c668d" stroke-width="1.5"/>
<text x="1038" y="39" font-family="monospace" font-size="10" fill="#d9c8ef">notes_untitled.txt</text>
