<path d="M632 125h364v133H626Z" fill="#090c17" stroke="#6f5b89" stroke-width="3"/>
<rect x="642" y="136" width="341" height="110" fill="#15192a"/>
<path d="M642 153h341" stroke="#39304d" stroke-width="1"/>
<circle cx="653" cy="145" r="2.5" fill="#d7789b"/><circle cx="663" cy="145" r="2.5" fill="#d5b47a"/><circle cx="673" cy="145" r="2.5" fill="#9cc9b5"/>
<g font-family="monospace" font-size="11">
 <text x="656" y="172" fill="#a4c9bc">~/workbench $</text><text x="758" y="172" fill="#e2d5ef"> git status</text>
 <text x="656" y="190" fill="#d5a0c5">modified:</text><text x="716" y="190" fill="#d4cbe7"> README.md</text>
 <text x="656" y="208" fill="#d5a0c5">untracked:</text><text x="720" y="208" fill="#d4cbe7"> one more idea</text>
 <text x="656" y="229" fill="#a4c9bc">keep going, anyway.</text>
</g>
