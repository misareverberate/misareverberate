<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">After hours — a workbench in progress</title>
<desc id="desc">A hand-composed vector illustration of a late-night developer's workspace, with a rainy window, scattered notes, terminal panes, a tiny cat, and a small stack of unfinished ideas.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10101f"/><stop offset="1" stop-color="#21182f"/></linearGradient>
  <linearGradient id="window" x2="0" y2="1"><stop stop-color="#202344"/><stop offset="1" stop-color="#765079"/></linearGradient>
  <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#51374e"/><stop offset="1" stop-color="#211a2c"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#a997d6" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="320" rx="10" fill="url(#bg)"/>
<rect width="1200" height="320" rx="10" fill="url(#grid)"/>
<!-- Window: deliberately blocky, like a small pixel-art city sketch -->
<rect x="34" y="28" width="535" height="218" rx="3" fill="#0c1020" stroke="#665178" stroke-width="2"/>
<rect x="44" y="38" width="515" height="198" fill="url(#window)"/>
<path d="M44 170l58-42 43 25 56-68 48 47 50-32 57 48 58-61 52 48 42-26 51 38v89H44Z" fill="#3b3158"/>
<path d="M44 195l76-30 50 18 65-34 53 35 60-26 57 27 55-35 49 28 50-17v75H44Z" fill="#24263f"/>
<g fill="#f1a8cb">
 <path d="M66 202h5v7h-5zM88 185h5v7h-5zM130 210h5v7h-5zM168 190h5v7h-5zM204 205h5v7h-5zM231 176h5v7h-5zM270 207h5v7h-5zM311 190h5v7h-5zM343 213h5v7h-5zM386 183h5v7h-5zM424 207h5v7h-5zM461 190h5v7h-5zM516 210h5v7h-5z"/>
</g>
<g stroke="#b4b7ec" stroke-width="1" opacity=".45"><path d="M81 53l-8 19m61-7-8 19m112-22-8 19m70-5-8 19m91-13-8 19m89-7-8 19m69-3-8 19"/></g>
<path d="M303 38v198M44 137h515" stroke="#0c1020" stroke-width="6"/>
