<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">A cat by a rainy window</title>
<desc id="desc">A small dark cat curled up on a broad windowsill at night, with soft violet light and a quiet rainy city beyond the glass.</desc>
<defs>
  <linearGradient id="room" x2="0" y2="1"><stop stop-color="#10101c"/><stop offset="1" stop-color="#191527"/></linearGradient>
  <linearGradient id="night" x2="0" y2="1"><stop stop-color="#252642"/><stop offset="1" stop-color="#665071"/></linearGradient>
  <linearGradient id="sill" x2="0" y2="1"><stop stop-color="#594057"/><stop offset="1" stop-color="#272033"/></linearGradient>
  <radialGradient id="moonGlow"><stop stop-color="#c5a8ef" stop-opacity=".25"/><stop offset="1" stop-color="#c5a8ef" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="320" rx="10" fill="url(#room)"/>
<!-- quiet window, no interface-like decorations -->
<rect x="280" y="24" width="650" height="228" rx="4" fill="#090b16" stroke="#4e405f" stroke-width="3"/>
<rect x="291" y="35" width="628" height="206" fill="url(#night)"/>
<circle cx="785" cy="88" r="88" fill="url(#moonGlow)"/>
<path d="M291 174l68-38 46 19 62-63 54 53 57-31 59 39 65-57 59 49 55-27 103 50v73H291Z" fill="#35304f"/>
<path d="M291 199l75-26 54 18 73-32 61 29 64-22 67 28 67-32 57 23 69-18 61 21v53H291Z" fill="#24243d"/>
<g fill="#e7b1d0" opacity=".78">
 <rect x="329" y="195" width="5" height="8"/><rect x="354" y="184" width="5" height="8"/><rect x="395" y="207" width="5" height="8"/>
 <rect x="433" y="188" width="5" height="8"/><rect x="471" y="204" width="5" height="8"/><rect x="518" y="180" width="5" height="8"/>
 <rect x="554" y="205" width="5" height="8"/><rect x="603" y="189" width="5" height="8"/><rect x="649" y="209" width="5" height="8"/>
 <rect x="694" y="186" width="5" height="8"/><rect x="739" y="202" width="5" height="8"/><rect x="783" y="180" width="5" height="8"/>
 <rect x="828" y="201" width="5" height="8"/><rect x="873" y="187" width="5" height="8"/>
</g>
<!-- rain: restrained, thin strokes -->
<g stroke="#b9b4e1" stroke-width="1.2" stroke-linecap="round" opacity=".32">
 <path d="M324 49l-7 17m58 9-7 17m88-31-7 17m67 15-7 17m73-41-7 17m78 10-7 17m75-37-7 17m79 3-7 17m62-28-7 17m59 13-7 17m50-37-7 17"/>
</g>
<!-- frame -->
<path d="M604 35v206M291 140h628" stroke="#11101e" stroke-width="7"/>
<!-- wide sill with a little pool of reflected violet light -->
<path d="M200 244Q590 233 1000 244l72 31H127Z" fill="url(#sill)" stroke="#735778" stroke-width="2"/>
<path d="M157 276Q610 266 1070 276" fill="none" stroke="#9b77a4" stroke-opacity=".35" stroke-width="2"/>
<ellipse cx="586" cy="254" rx="215" ry="15" fill="#b38bd8" opacity=".09" filter="url(#soft)"/>
<!-- cat, the focal point -->
<ellipse cx="600" cy="249" rx="118" ry="13" fill="#090a13" opacity=".48"/>
<!-- curled body -->
<path d="M496 238Q472 208 493 181Q517 151 568 169Q610 181 638 209Q665 232 705 219Q739 208 758 229Q774 247 751 258H513Q493 254 496 238Z" fill="#10111d" stroke="#65516f" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M520 221Q526 184 565 184Q606 184 633 218Q650 239 686 239" fill="none" stroke="#34283f" stroke-width="8" stroke-linecap="round"/>
<!-- tail curling around paws -->
<path d="M702 232Q735 228 739 247Q741 261 716 261Q691 260 680 246" fill="none" stroke="#0b0d18" stroke-width="17" stroke-linecap="round"/>
<path d="M704 231Q732 231 734 247" fill="none" stroke="#51405f" stroke-width="2.5" stroke-linecap="round"/>
<!-- head and ears -->
<path d="M511 190L507 157Q506 150 514 156L536 171Q555 164 574 174L594 158Q602 152 602 163L600 192Q591 214 559 216Q527 215 511 190Z" fill="#11121e" stroke="#65516f" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M516 164l16 13-13 8Z M589 165l-14 13 13 8Z" fill="#8e628b" opacity=".75"/>
<!-- sleepy eyes, tiny nose and whiskers -->
<path d="M529 190q7 6 14 0m20 0q7 6 14 0" fill="none" stroke="#d7a5d0" stroke-width="2.8" stroke-linecap="round"/>
<path d="M555 198l5 0-2.5 3.5Z" fill="#d28eaf"/>
<path d="M552 203q5 5 10 0" fill="none" stroke="#9b718f" stroke-width="1.6" stroke-linecap="round"/>
<g stroke="#9b8aa9" stroke-width="1.3" stroke-linecap="round" opacity=".75">
 <path d="M528 199l-23-4m23 9-20 3m70-8 22-4m-22 9 20 3"/>
</g>
<!-- a couple of tiny, imperfect stars reflected in the glass -->
<g fill="#d7c2ee" opacity=".85"><path d="M372 72l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/><circle cx="841" cy="111" r="1.8"/><circle cx="459" cy="115" r="1.4"/></g>
<rect x="1" y="1" width="1198" height="318" rx="9" fill="none" stroke="#4c3d5e" stroke-width="2"/>
</svg>